services:
  postgres:
    image: postgres:16-alpine
    container_name: linkrowth-postgres
    environment:
      POSTGRES_USER: linkrowth
      POSTGRES_PASSWORD: linkrowth
      POSTGRES_DB: linkrowth
    ports:
      - "5432:5432"
    volumes:
      - linkrowth_pg:/var/lib/postgresql/data
      # Runs once on first DB init (empty volume). Re-run anytime with: ./helpers/migrate.sh
      - ./helpers/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkrowth -d linkrowth"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: linkrowth-api
    ports:
      - "4000:4000"
    # Loads API_KEY / LLM keys the same way as local `npm run dev`.
    # Do not put API_KEY or OPENAI_API_KEY in `environment` below — empty
    # Compose interpolations would override these and break auth.
    env_file:
      - path: api/.env
        required: false
      - path: agent/.env
        required: false
    environment:
      PORT: "4000"
      NODE_ENV: production
      # Must use the compose service hostname, not localhost from api/.env
      DATABASE_URL: postgresql://linkrowth:linkrowth@postgres:5432/linkrowth
      LINKROWTH_AGENT: multi_step_engage
      LINKROWTH_PROVIDER: ${LINKROWTH_PROVIDER:-openai}
      LINKROWTH_OPENAI_MODEL: ${LINKROWTH_OPENAI_MODEL:-gpt-4o-mini}
      LINKROWTH_GEMINI_MODEL: ${LINKROWTH_GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  linkrowth_pg:
