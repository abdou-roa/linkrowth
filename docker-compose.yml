services:
  postgres:
    image: postgres:16-alpine
    container_name: linkrowth-postgres
    environment:
      POSTGRES_USER: linkrowth
      POSTGRES_PASSWORD: linkrowth
      POSTGRES_DB: linkrowth
    ports:
      - "5432:5432"
    volumes:
      - linkrowth_pg:/var/lib/postgresql/data
      # Runs once on first DB init (empty volume). Re-run anytime with: ./helpers/migrate.sh
      - ./helpers/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkrowth -d linkrowth"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: linkrowth-api
    ports:
      - "4000:4000"
    # Loads API_KEY (and other vars) from api/.env — same file local `npm run dev` uses.
    # Do not set API_KEY under environment: below or it overrides this with the Compose default.
    env_file:
      - ./api/.env
    environment:
      PORT: "4000"
      NODE_ENV: production
      # Compose network hostname (overrides localhost DATABASE_URL from api/.env)
      DATABASE_URL: postgresql://linkrowth:linkrowth@postgres:5432/linkrowth
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  linkrowth_pg:
